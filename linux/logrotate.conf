# ============================================================================
# Description:  User-level log rotation policy for background applications.
# Destination:  ~/.config/logrotate/logrotate.conf
# Reference:    man:logrotate(8) | man:logrotate.conf(5)
# ============================================================================

<absolute path to log file> {
	weekly
	rotate 4
	create
	dateext
	missingok
	notifempty
	copytruncate
}
