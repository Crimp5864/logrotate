# ============================================================================
# Description:  User-level log rotation policy for background applications.
# Reference:    Get-Help Log-Rotate
# Destination:  %APPDATA%\Log-Rotate\Log-Rotate.conf
# ============================================================================

"<absolute path to log file>" {
	weekly
	rotate 4
	create
	dateext
	missingok
	compress
	delaycompress
	missingok
	notifempty
}
